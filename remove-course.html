<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Remove Course</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-content-wrap">
            <div id="topbar-container"></div>
            <main class="app-main">
                <form id="remove-course-form">
                    <input type="hidden" id="courseId">

                    <div class="page-header">
                        <h1>Remove course</h1>
                        <p>Are you sure you want to remove this course?</p>
                        <p><strong id="course-name-display">Loading course details...</strong></p>
                    </div>

                    <button type="submit"
                        style="background-color:#c0534a; border-color:#c0534a; width:fit-content; padding:12px 18px; font-size:1rem; margin:5px auto 15px; display:block; color: white; border-radius: 6px; cursor: pointer;">
                        Yes, remove the course
                    </button>

                    <div class="buttons">
                        <a href="courses.html">Cancel</a>
                    </div>
                </form>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a
                        href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <!-- Firebase Module Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="JS/topbar.js"></script>
    <script type="module" src="JS/auth.js"></script>
    <script type="module" src="JS/courses.js"></script>
    <script type="module" src="JS/config.js"></script>
    <script type="module" src="JS/AI.js"></script>

    <script type="module">
        import { auth } from './JS/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { loadRemoveConfirm, handleRemoveCourse } from './JS/courses.js';

        window.firebaseAuth = auth;

        const form = document.getElementById("remove-course-form");

        if (form) {
            form.addEventListener("submit", async (e) => {
                await handleRemoveCourse(e);
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    await loadRemoveConfirm();
                } catch (error) {
                    console.error("Failed to fetch confirmation details:", error);
                    const display = document.getElementById("course-name-display");
                    if (display) display.textContent = "Error loading course target.";
                }
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>

</body>

</html>

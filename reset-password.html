<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Planora - Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="inner">
            <div class="logo">
                <a href="index.html">
                    <img src="images/planora_logo.png" alt="Planora Logo">
                </a>
            </div>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <a href="about-us.html">About Us</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="nav-cta">Register</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1>Reset Password</h1>
        <p>Enter your email to receive a password reset link.</p>

        <form id="reset-form">
            <label>Email</label><br>
            <input id="reset-email" class="input-format" type="email" placeholder="Enter your email" required><br><br>

            <button type="submit">Send Reset Link</button>

            <a href="login.html">Back to Login</a>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>

    <!-- Firebase Module Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
            }
        }
    </script>
    
    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="JS/auth.js"></script>
    
    <script type="module">
        import { resetPassword } from './JS/auth.js';
        
        const form = document.getElementById("reset-form");
        const emailInput = document.getElementById("reset-email");
        
        if (form) {
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                
                if (!email) {
                    showToast("Please enter your email address", "error");
                    return;
                }
                
                const result = await resetPassword(email);
                
                if (result.success) {
                    showToast("Password reset email sent! Check your inbox.", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 3000);
                } else {
                    showToast(result.error || "Failed to send reset email", "error");
                }
            });
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">

</head>

<body class="page-auth">

    <div class="auth-top">
        <a href="index.html">
            <img src="images/planora_logo.png" alt="Planora Logo">
        </a>
    </div>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your email to receive a password reset link.</p>

            <form id="reset-form">
                <label for="reset-email">Email</label>
                <input id="reset-email" class="input-format" type="email" placeholder="Enter your email" required>

                <button type="submit">Send Reset Link</button>

                <div class="auth-footer">
                    <a href="login.html">← Back to login</a>
                </div>
            </form>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="JS/auth.js"></script>

    <script type="module">
        import { resetPassword } from './JS/auth.js';
        import { showToast } from './JS/utils.js';

        const form = document.getElementById("reset-form");
        const emailInput = document.getElementById("reset-email");

        if (form) {
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = emailInput.value.trim();

                if (!email) {
                    showToast("Please enter your email address", "error");
                    return;
                }

                const result = await resetPassword(email);

                if (result.success) {
                    showToast("Password reset email sent! Check your inbox.", "success");
                    setTimeout(() => { window.location.href = "login.html"; }, 3000);
                } else {
                    showToast(result.error || "Failed to send reset email", "error");
                }
            });
        }
    </script>

</body>
</html>

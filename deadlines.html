<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Deadlines</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-app">
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <main class="app-main">
            <img src="images/header.png" alt="Planora" class="banner">
            <div class="page-header">
                <h1>Add a deadline</h1>
                <p>Track your assignments and exams to stay organized.</p>
            </div>

            <form onsubmit="alert('Deadline added successfully!'); window.location.href='courses.html'; return false;">
                <label>Deadline type</label>
                <select class="input-format" required>
                    <option value="">Select type</option>
                    <option value="exam">Exam</option>
                    <option value="assignment">Assignment</option>
                </select>
                <label>Title</label>
                <input class="input-format" type="text" placeholder="Midterm Exam" required>
                <label>Deadline date</label>
                <input class="input-format" type="date" required>
                <label>Deadline time</label>
                <input class="input-format" type="time">
                <button type="submit">Add deadline</button>
            </form>
        </main>
    </div>
    <footer>
        <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>
    <script src="JS/sidebar.js"></script>
    <script src="JS/utils.js"></script>
    <script src="JS/auth.js"></script>
    <script>Session.require();</script>
    <script src="JS/config.js"></script>
    <script src="JS/AI.js"></script>
</body>
</html>

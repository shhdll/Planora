<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Deadlines</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-app">
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-content-wrap">
            <div id="topbar-container"></div>
            <main class="app-main">
                <div class="page-header">
                    <h1>Add a deadline</h1>
                    <p>Track your assignments and exams to stay organized.</p>
                </div>

                <div class="form-card">
                    <form id="deadline-form">
                        <div class="form-divider">
                            <div class="form-group">
                                <label for="deadline-course">Course</label>
                                <select id="deadline-course" class="input-format" required>
                                    <option value="" disabled selected>Loading courses…</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="deadline-title">Title</label>
                                <input id="deadline-title" class="input-format" type="text" placeholder="Midterm Exam" required>
                            </div>
                        </div>

                        <div class="form-divider">
                            <div class="form-group">
                                <label for="deadline-date">Date</label>
                                <input id="deadline-date" class="input-format" type="date" required>
                            </div>
                            <div class="form-group">
                                <label for="deadline-time">Time</label>
                                <input id="deadline-time" class="input-format" type="time">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="deadline-priority">Priority</label>
                            <select id="deadline-priority" class="input-format">
                                <option value="High">High</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                        <input id="deadline-description" type="hidden" value="">

                        <div class="form-actions">
                            <a href="dashboard.html" class="btn-back">← Back</a>
                            <button type="submit" class="btn-submit">Add deadline</button>
                        </div>
                    </form>
                </div>

                <h2>Your deadlines</h2>
                <div id="deadlines-list"></div>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <!-- Firebase Module Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
            }
        }
    </script>
    
    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="JS/topbar.js"></script>
    <script type="module" src="JS/auth.js"></script>
    <script type="module" src="JS/config.js"></script>
    <script type="module" src="JS/AI.js"></script>
    <script type="module" src="JS/deadlines.js"></script>
    <script type="module" src="JS/reminders.js"></script>
    
    <script type="module">
        import { Session } from './JS/utils.js';
        
        // Check if user is logged in
        Session.require();
        
        // Note: deadlines.js automatically initializes on DOMContentLoaded
        // and reminders.js runs automatically
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Deadlines</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-app">
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-content-wrap">
            <div id="topbar-container"></div>
            <main class="app-main">
                <div class="page-header">
                    <h1>Add a deadline</h1>
                    <p>Track your assignments and exams to stay organized.</p>
                </div>

                <form id="deadline-form">
                    <label>Deadline type</label>
                    <select id="deadline-course" class="input-format" required>
                        <option value="">Select type</option>
                        <option value="exam">Exam</option>
                        <option value="assignment">Assignment</option>
                    </select>
                    <label>Title</label>
                    <input id="deadline-title" class="input-format" type="text" placeholder="Midterm Exam" required>
                    <label>Deadline date</label>
                    <input id="deadline-date" class="input-format" type="date" required>
                    <label>Deadline time</label>
                    <input id="deadline-time" class="input-format" type="time"> 
                    <label>Priority</label>

<select id="deadline-priority" class="input-format">
    <option value="High">High</option>
    <option value="Medium" selected>Medium</option>
    <option value="Low">Low</option>
</select>                   <input id="deadline-description" type="hidden" value="">
                    <button type="submit">Add deadline</button>
                </form>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <script src="JS/utils.js"></script>
    <script src="JS/sidebar.js"></script>
    <script src="JS/topbar.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/config.js"></script>
    <script src="JS/AI.js"></script>
    <script src="JS/deadlines.js"></script>
    <script src="JS/reminders.js"></script>
    <script>Session.require();</script>
</body>
</html>

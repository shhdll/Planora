<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Edit Course</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="topbar.css"> <!-- Links your global topbar styles -->
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-content-wrap">
            <div id="topbar-container"></div>
            <main class="app-main">
                <div class="page-header">
                    <h1>Edit course</h1>
                </div>

                <form id="edit-course-form">
                    <input type="hidden" id="courseId">

                    <label for="courseName">Course name</label>
                    <input class="input-format" type="text" id="courseName" placeholder="Web Applications Development" required>

                    <label for="courseCode">Course code</label>
                    <input class="input-format" type="text" id="courseCode" placeholder="SWE381" required>

                    <label for="instructor">Instructor</label>
                    <input class="input-format" type="text" id="instructor" placeholder="Dr. Rawan">

                    <label for="creditHours">Credit hours</label>
                    <input class="input-format" type="number" id="creditHours" placeholder="3" min="1" max="6">

                    <button type="submit">Save changes</button>
                    <a href="courses.html">Back to courses</a>
                </form>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <!-- Firebase Module Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
            }
        }
    </script>
    
    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="JS/sidebar.js"></script>
    <script type="module" src="JS/topbar.js"></script>
    <script type="module" src="JS/auth.js"></script>
    <script type="module" src="JS/courses.js"></script>
    <script type="module" src="JS/config.js"></script>
    <script type="module" src="JS/AI.js"></script>
    
    <script type="module">
        import { auth } from './JS/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { loadEditForm, handleEditCourse } from './JS/courses.js';
        
        // Share auth instance instantly with topbar.js
        window.firebaseAuth = auth;
        
        // Attach form submit handler cleanly
        const form = document.getElementById("edit-course-form");
        if (form) {
            form.addEventListener("submit", async (e) => {
                await handleEditCourse(e);
            });
        }

        // Initialize state inside the listener so the form waits for Firebase
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // Populate the course data input values
                    await loadEditForm();
                } catch (error) {
                    console.error("Error populating editing forms:", error);
                }
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>

</body>
</html>

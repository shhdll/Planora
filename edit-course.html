<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Edit Course</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-content-wrap">
            <div id="topbar-container"></div>
            <main class="app-main">
                <div class="page-header">
                    <h1>Edit course</h1>
                </div>

                <form id="edit-course-form">
                    <input type="hidden" id="courseId">

                    <label>Course name</label>
                    <input class="input-format" type="text" id="courseName" placeholder="Web Applications Development" required>

                    <label>Course code</label>
                    <input class="input-format" type="text" id="courseCode" placeholder="SWE381" required>

                    <label>Instructor</label>
                    <input class="input-format" type="text" id="instructor" placeholder="Dr. Rawan">

                    <label>Credit hours</label>
                    <input class="input-format" type="number" id="creditHours" placeholder="3" min="1" max="6">

                    <button type="submit">Save changes</button>
                    <a href="courses.html">Back to courses</a>
                </form>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <script src="JS/utils.js"></script>
    <script src="JS/sidebar.js"></script>
    <script src="JS/topbar.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/courses.js"></script>
    <script src="JS/config.js"></script>
    <script src="JS/AI.js"></script>
    <script>
        Session.require();
        loadEditForm();
        document.getElementById("edit-course-form").addEventListener("submit", handleEditCourse);
    </script>

</body>
</html>

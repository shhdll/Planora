<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-auth">

    <div class="auth-top">
        <a href="index.html"><img src="images/planora_logo.png" alt="Planora"></a>
    </div>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1>Create your account</h1>
            <p class="subtitle">Free workspace for your semester</p>

            <form id="register-form">
                <label for="reg-name">Full name</label>
                <input id="reg-name" class="input-format" type="text" placeholder="Alex Rivera" required>

                <label for="reg-email">Email</label>
                <input id="reg-email" class="input-format" type="email" placeholder="you@university.edu" required>

                <label for="reg-password">Password</label>
                <input id="reg-password" class="input-format" type="password" placeholder="At least 4 characters" required>

                <label for="reg-confirm">Confirm password</label>
                <input id="reg-confirm" class="input-format" type="password" placeholder="Re-enter password" required>

                <button type="submit">Register</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a><br>
                <a href="index.html">Back to home</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Planora. All rights reserved. · <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>

    <script src="JS/utils.js"></script>
    <script src="JS/auth.js"></script>
    <script>
        // Check if user is already logged in
        if (typeof Session !== 'undefined') {
            Session.redirectIfLoggedIn();
        }
        
        // Attach register handler
        const form = document.getElementById("register-form");
        if (form) {
            form.addEventListener("submit", function(e) {
                if (typeof handleRegister !== 'undefined') {
                    handleRegister(e);
                } else {
                    console.error("handleRegister function not found. Make sure auth.js is loaded.");
                    e.preventDefault();
                }
            });
        } else {
            console.error("Register form not found");
        }
    </script>

</body>

</html>

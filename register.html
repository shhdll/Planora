<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-auth">

    <div class="auth-top">
        <a href="index.html"><img src="images/planora_logo.png" alt="Planora"></a>
    </div>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1>Create your account</h1>
            <p class="subtitle">Free workspace for your semester</p>

            <form id="register-form">
                <label for="reg-name">Full name</label>
                <input id="reg-name" class="input-format" type="text" placeholder="Alex Rivera" required>

                <label for="reg-email">Email</label>
                <input id="reg-email" class="input-format" type="email" placeholder="you@university.edu" required>

                <label for="reg-password">Password</label>
                <input id="reg-password" class="input-format" type="password" placeholder="At least 6 characters" required>

                <label for="reg-confirm">Confirm password</label>
                <input id="reg-confirm" class="input-format" type="password" placeholder="Re-enter password" required>

                <button type="submit">Register</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a><br>
                <a href="index.html">Back to home</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Planora. All rights reserved. · <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>

    <script>
        // API URL - change to your backend port (5000)
        const API_URL = 'http://localhost:5000/api';

        // Check if already logged in
        if (localStorage.getItem('authToken')) {
            window.location.href = "dashboard.html";
        }

        // Toast function if not in utils
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#22c55e';
            toast.style.color = 'white';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '8px';
            toast.style.zIndex = '9999';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Register function
        async function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim().toLowerCase();
            const password = document.getElementById("reg-password").value;
            const confirm = document.getElementById("reg-confirm").value;

            // Validation
            if (!name || !email || !password || !confirm) {
                showToast("Please fill in all fields.", "error");
                return;
            }

            if (password.length < 6) {
                showToast("Password must be at least 6 characters.", "error");
                return;
            }

            if (password !== confirm) {
                showToast("Passwords do not match.", "error");
                return;
            }

            // Show loading state
            const submitBtn = document.querySelector('#register-form button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Creating account...";
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Save token and user data
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    showToast(`Welcome to Planora, ${name}! 🎉`, "success");

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                } else {
                    showToast(data.message || "Registration failed", "error");
                }
            } catch (error) {
                console.error("Registration error:", error);
                showToast("Cannot connect to server. Make sure backend is running on port 5000", "error");
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }

        // Attach event listener when page loads
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById("register-form");
            if (form) {
                form.addEventListener("submit", handleRegister);
            }
        });
    </script>

</body>

</html>

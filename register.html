<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">

</head>

<body class="page-auth">

    <div class="auth-top">
        <a href="index.html"><img src="images/planora_logo.png" alt="Planora"></a>
    </div>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1>Create your account</h1>
            <p class="subtitle">Free workspace for your semester</p>

            <form id="register-form">
                <label for="reg-name">Full name</label>
                <input id="reg-name" class="input-format" type="text" placeholder="Noura Fahad" required>

                <label for="reg-email">Email</label>
                <input id="reg-email" class="input-format" type="email" placeholder="you@ksu.edu" required>

                <label for="reg-password">Password</label>
                <input id="reg-password" class="input-format" type="password" placeholder="At least 6 characters"
                    required>

                <label for="reg-confirm">Confirm password</label>
                <input id="reg-confirm" class="input-format" type="password" placeholder="Re-enter password" required>

                <button type="submit">Register</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a><br>
                <a href="index.html">Back to home</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Planora. All rights reserved. · <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>

    <!-- Firebase Module Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        import { auth } from './JS/firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const form = document.getElementById("register-form");
        const nameInput = document.getElementById("reg-name");
        const emailInput = document.getElementById("reg-email");
        const passwordInput = document.getElementById("reg-password");
        const confirmInput = document.getElementById("reg-confirm");

        function showMessage(message, type) {
            const toast = document.createElement("div");
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: ${type === 'error' ? '#ef4444' : '#22c55e'};
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                z-index: 10000;
                font-weight: bold;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        const toast = (typeof showToast !== 'undefined') ? showToast : showMessage;

        async function handleRegister(event) {
            event.preventDefault();
            console.log("Register function called!");

            const name = nameInput.value.trim();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            console.log("Form values:", { name, email, password: "***", confirm: "***" });

            if (!name || !email || !password || !confirm) {
                toast("Fill all fields", "error");
                return;
            }
            if (password !== confirm) {
                toast("Passwords do not match", "error");
                return;
            }
            if (password.length < 4) {
                toast("Password must be at least 4 characters", "error");
                return;
            }
            try {
                console.log("Creating user in Firebase...");
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log("User created:", user);

                // Store user data in localStorage (for compatibility)
                const users = JSON.parse(localStorage.getItem("users") || "[]");
                users.push({ name, email, password: "FIREBASE_AUTH", uid: user.uid });
                localStorage.setItem("users", JSON.stringify(users));

                // Save current user session
                localStorage.setItem("currentUser", JSON.stringify({ name, email, uid: user.uid }));

                toast("Account created successfully!", "success");

                console.log("Redirecting to dashboard...");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 500);

            } catch (error) {
                console.error("Registration error:", error);
                let errorMessage = "Registration failed";
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = "User already exists";
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = "Password is too weak";
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = "Invalid email address";
                }
                toast(errorMessage, "error");
            }
        }

        if (form) {
            form.addEventListener("submit", handleRegister);
            console.log("Form listener attached!"); // Debug
        } else {
            console.error("Form not found!");
        }

        if (auth.currentUser) {
            window.location.href = "dashboard.html";
        }
    </script>

</body>

</html>

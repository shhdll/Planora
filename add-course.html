<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Add Course</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>

        <div class="app-content-wrap">
            <div id="topbar-container"></div>

            <main class="app-main">
                <div class="page-header">
                    <h1>Add a new course</h1>
                    <p>Enter the course details to start planning your study schedule.</p>
                </div>

                <div class="form-card">
                    <form id="add-course-form">
                        <div class="form-group">
                            <label for="courseName">Course name</label>
                            <input class="input-format" type="text" id="courseName" placeholder="Web Applications Development" required>
                        </div>

                        <div class="form-group">
                            <label for="courseCode">Course code</label>
                            <input class="input-format" type="text" id="courseCode" placeholder="SWE381" required>
                        </div>

                        <div class="form-divider">
                            <div class="form-group">
                                <label for="instructor">Instructor name</label>
                                <input class="input-format" type="text" id="instructor" placeholder="Dr. Rawan">
                            </div>
                            <div class="form-group">
                                <label for="creditHours">Credit hours</label>
                                <input class="input-format" type="number" id="creditHours" placeholder="3" min="1" max="6">
                            </div>
                        </div>

                        <div class="form-actions">
                            <a href="courses.html" class="btn-back">← Back</a>
                            <button type="submit" class="btn-submit">Add course</button>
                        </div>
                    </form>
                </div>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="JS/sidebar.js"></script>
    <script type="module" src="JS/topbar.js"></script>

    <script type="module">
        import { auth } from './JS/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { handleAddCourse } from './JS/courses.js';

        window.firebaseAuth = auth;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                setTimeout(() => { window.location.href = "login.html"; }, 500);
                return;
            }

            const form = document.getElementById("add-course-form");
            if (form) form.addEventListener("submit", handleAddCourse);
        });
    </script>

</body>
</html>

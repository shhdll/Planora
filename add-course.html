<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Planora - Add Course</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header-func">
        <header>
            <div class="logo">
                <a href="index.html"><img src="images/planora_logo.png" alt="Smart Study Planner Logo"></a>
            </div>

            <nav>
                <a href="index.html">Home</a> |
                <a href="dashboard.html">Dashboard</a> |
                <a href="courses.html">Courses</a> |
                <a href="deadlines.html">Deadlines</a> |
                <a href="availability.html">Availability</a> |
                <a href="study-plan.html">Study Plan</a> |
                <a href="statistics.html">Statistics</a> |
                <a href="#" onclick="handleLogout()">Log Out</a>
            </nav>
        </header>
    </div>

    <div>
        <h1>Add a New Course</h1>
        <p>Enter the course details to start planning your study schedule.</p>
    </div>

    <form id="add-course-form">

        <label for="courseName">Course Name</label><br>
        <input class="input-format" type="text" id="courseName"
            placeholder="Web Applications Development" required>
        <br><br>

        <label for="courseCode">Course Code</label><br>
        <input class="input-format" type="text" id="courseCode"
            placeholder="SWE381" required>
        <br><br>

        <label for="instructor">Instructor Name</label><br>
        <input class="input-format" type="text" id="instructor"
            placeholder="Dr. Rawan">
        <br><br>

        <label for="creditHours">Credit Hours</label><br>
        <input class="input-format" type="number" id="creditHours"
            placeholder="3" min="1" max="6">
        <br><br>

        <button type="submit">Add Course</button>

        <br>

        <a href="courses.html">Back to Courses</a>
    </form>

    <footer>
        <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/courses.js"></script>
    <script>
        Session.require();
        document.getElementById("add-course-form").addEventListener("submit", handleAddCourse);
    </script>

    <!--
    1. Removed onsubmit="alert(...)" from <form> — replaced with real event listener
    2. Added id="add-course-form" to <form> so JS can attach the submit handler
    3. All input fields already had id attributes — kept as-is (courseName, courseCode, instructor, creditHours)
    4. Added min="1" max="6" to creditHours input for basic validation
    5. Changed Log Out href to onclick="handleLogout()"
    6. Added <script> tags for utils.js, auth.js, courses.js
    7. Added inline script: Session.require() + attaches handleAddCourse to form
    8. Fixed logo image path from "planora_logo.png" to "images/planora_logo.png"
    -->

</body>
</html>

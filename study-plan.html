<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Study Plan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">


</head>

<body class="page-app">

    <div class="app-shell">

        <div id="sidebar-container"></div>

        <div class="app-content-wrap">

            <div id="topbar-container"></div>

            <main class="app-main">

                <div class="page-header">

                    <h1>Your study plan</h1>

                    <p>
                        Your study plan will appear here
                        after you add your courses,
                        deadlines, and availability.
                    </p>

                </div>

                <h2>Weekly study plan</h2>

                <button id="generate-plan-btn">Generate Weekly Study Plan</button>

                <table class="plan-table">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Date</th>
                            <th>Course</th>
                            <th>Session Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="study-plan-body"></tbody>
                </table>

            </main>

            <footer>

                <p>
                    &copy; 2026 Planora.
                    All Rights Reserved.
                    |
                    Contact:
                    <a href="mailto:support@planora.com">
                        support@planora.com
                    </a>
                </p>

            </footer>

        </div>

    </div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">


    <!-- Firebase Module Scripts -->

    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
        }
    }
</script>

    <script src="JS/config.js"></script>

    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="JS/sidebar.js"></script>
    <script type="module" src="JS/topbar.js"></script>
    <script type="module" src="JS/AI.js"></script>
    <script type="module" src="JS/planner.js"></script>

    <script type="module">
        import { StudyPlanner } from './JS/planner.js';
        import { auth } from './JS/firebase-config.js';

        window.firebaseAuth = auth;

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            await StudyPlanner.renderStudyPlan();

            const btn = document.getElementById("generate-plan-btn");
            if (btn) {
                btn.addEventListener("click", async () => {
                    await StudyPlanner.generateWeeklyPlan();
                });
            }
        });
    </script>
</body>

</html>

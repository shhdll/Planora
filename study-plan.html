<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Study Plan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-app">
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-content-wrap">
            <div id="topbar-container"></div>
            <main class="app-main">
                <div class="page-header">
                    <h1>Your study plan</h1>
                    <p>Your study plan will appear here after you add your courses, deadlines, and availability.</p>
                </div>

                <h2>Example study plan</h2>
                <button id="generate-plan-btn">
    Generate Weekly Study Plan
</button>
                <table>
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Session</th>
                            <th>Study time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                   <tbody id="study-plan-body">
</tbody>
                </table>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <!-- Firebase Module Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
            }
        }
    </script>
    
    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="JS/topbar.js"></script>
    <script type="module" src="JS/auth.js"></script>
    <script type="module" src="JS/config.js"></script>
    <script type="module" src="JS/AI.js"></script>
    <script type="module" src="JS/planner.js"></script>
    
    <script type="module">

import { Session } from './JS/utils.js';
import { StudyPlanner } from './JS/planner.js';

Session.require();

await StudyPlanner.renderStudyPlan();

const btn = document.getElementById("generate-plan-btn");

if (btn) {

    btn.addEventListener("click", async () => {
        await StudyPlanner.generateWeeklyPlan();
    });
}

</script>
</body>
</html>

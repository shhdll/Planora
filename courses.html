<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Courses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>

        <main class="app-main">
            <div class="page-header">
                <h1>Your Courses</h1>
                <p>Manage your courses below</p>
            </div>

            <div class="buttons">
                <a href="add-course.html">Add new course</a>
            </div>

            <ul id="courses-list"></ul>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>

    <script src="JS/sidebar.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/courses.js"></script>
    <script>
        Session.require();
        renderCourses();
    </script>
    <script src="JS/config.js"></script>
    <script src="JS/AI.js"></script>

</body>
</html>
    <!--
    1. Removed hardcoded static course list items (Web Applications, Database Systems)
    2. Added id="courses-list" to <ul> so JS can target and populate it dynamically
    3. Changed Log Out href from "index.html" to onclick="handleLogout()" for real session clearing
    4. Added inline script: Session.require() guards the page, renderCourses() builds the list
    5. Edit and Remove links now pass ?id= query param so JS knows which course was selected
    6. "Add Deadline" link passes ?courseId= so the deadlines page can pre-select the course
    -->

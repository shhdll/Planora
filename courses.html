<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Courses</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="topbar.css">
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>

        <div class="app-content-wrap">
            <div id="topbar-container"></div>

            <main class="app-main">
                <div class="page-header">
                    <h1>Your courses</h1>
                    <p>Manage your courses below</p>
                </div>

                <div class="courses-toolbar">
                    <span style="font-size:0.85rem;color:#64748b" id="courses-count"></span>
                    <a href="add-course.html" class="add-course-btn">+ Add new course</a>
                </div>

                <div class="courses-grid" id="courses-list">Loading...</div>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All rights reserved. · <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="JS/topbar.js"></script>
    <script type="module" src="JS/deadlines.js"></script>
    <script type="module" src="JS/reminders.js"></script>
    <script type="module" src="JS/AI.js"></script>

    <script type="module">
        import { auth } from './JS/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { renderCourses } from './JS/courses.js';
        
        import { loadSidebar } from './JS/sidebar.js';

        window.firebaseAuth = auth;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadSidebar();
                renderCourses();
            } else {
                if (typeof showToast === "function") {
                    showToast("Please log in to continue", "info");
                }
                setTimeout(() => { window.location.href = "login.html"; }, 500);
            }
        });
    </script>

</body>
</html>

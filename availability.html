<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Planora - Availability</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>

        <main class="app-main">
            <div class="page-header">
                <h1>Set Your Weekly Study Availability</h1>
                <p>Let Planora know when you are available to study, so we can help you create a better study plan.</p>
            </div>

            <form id="availability-form">
                <label>Select Available Days: </label><br><br>
                <input type="checkbox" name="days" value="sun">Sunday
                <input type="checkbox" name="days" value="mon">Monday
                <input type="checkbox" name="days" value="tue">Tuesday
                <input type="checkbox" name="days" value="wed">Wednesday
                <input type="checkbox" name="days" value="thu">Thursday
                <input type="checkbox" name="days" value="fri">Friday
                <input type="checkbox" name="days" value="sat">Saturday

                <br><br><br>

                <label>Start Time</label><br>
                <input id="start-time" class="input-format" type="time" required>

                <br><br>

                <label>End Time</label><br>
                <input id="end-time" class="input-format" type="time" required>

                <br><br>

                <button class="input-format" type="submit">Save Availability</button>

                <br>

                <a href="dashboard.html">Back</a>
            </form>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>

    <script src="JS/sidebar.js"></script>
    <script src="JS/utils.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/availability.js"></script>
    <script>
        Session.require();
    </script>

</body>
</html>

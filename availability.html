<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Availability</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-content-wrap">
            <div id="topbar-container"></div>
            <main class="app-main">
                <div class="page-header">
                    <h1>Set your weekly availability</h1>
                    <p>Let Planora know when you are available to study, so we can help you create a better study plan.</p>
                </div>

                <form id="availability-form">
                    <label>Select available days</label><br><br>
                    <input type="checkbox" name="days" value="sun"> Sunday
                    <input type="checkbox" name="days" value="mon"> Monday
                    <input type="checkbox" name="days" value="tue"> Tuesday
                    <input type="checkbox" name="days" value="wed"> Wednesday
                    <input type="checkbox" name="days" value="thu"> Thursday
                    <input type="checkbox" name="days" value="fri"> Friday
                    <input type="checkbox" name="days" value="sat"> Saturday

                    <br><br>

                    <label>Start time</label>
                    <input id="start-time" class="input-format" type="time" required>

                    <label>End time</label>
                    <input id="end-time" class="input-format" type="time" required>

                    <button type="submit">Save availability</button>
                    <a href="dashboard.html">Back</a>
                </form>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <!-- Firebase Module Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
            }
        }
    </script>
    
    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="JS/sidebar.js"></script>
    <script type="module" src="JS/topbar.js"></script>
    <script type="module" src="JS/auth.js"></script>
    <script type="module" src="JS/availability.js"></script>
    
    <script type="module">
        import { Session } from './JS/utils.js';
        
        // Check if user is logged in
        Session.require();
        
        // Note: availability.js automatically initializes on DOMContentLoaded
        // and handles form submission
    </script>

</body>
</html>

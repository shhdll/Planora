<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Availability</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-app">
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <main class="app-main">
            <div class="page-header">
                <h1>Set your weekly availability</h1>
                <p>Let Planora know when you're free to study.</p>
            </div>

            <form onsubmit="alert('Availability saved successfully!'); window.location.href='dashboard.html'; return false;">
                <label>Select available days</label><br><br>
                <input type="checkbox" name="days" value="sun"> Sunday
                <input type="checkbox" name="days" value="mon"> Monday
                <input type="checkbox" name="days" value="tue"> Tuesday
                <input type="checkbox" name="days" value="wed"> Wednesday
                <input type="checkbox" name="days" value="thu"> Thursday
                <input type="checkbox" name="days" value="fri"> Friday
                <input type="checkbox" name="days" value="sat"> Saturday
                <br><br>
                <label>Start time</label>
                <input class="input-format" type="time" required>
                <label>End time</label>
                <input class="input-format" type="time" required>
                <button type="submit">Save availability</button>
            </form>
        </main>
    </div>
    <footer>
        <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>
    <script src="JS/sidebar.js"></script>
    <script src="JS/utils.js"></script>
    <script src="JS/auth.js"></script>
    <script>Session.require();</script>
    <script src="JS/config.js"></script>
    <script src="JS/AI.js"></script>
</body>
</html>

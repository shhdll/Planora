<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Availability</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-app">

    <div class="app-shell">
        <div id="sidebar-container"></div>
        <div class="app-content-wrap">
            <div id="topbar-container"></div>
            <main class="app-main">
                <div class="page-header">
                    <h1>Set your weekly availability</h1>
                    <p>Let Planora know when you are available to study, so we can help you create a better study plan.</p>
                </div>

                <div class="form-card">
                    <form id="availability-form">
                        <div class="form-group">
                            <label>Select available days</label>
                            <div class="avail-days-grid">
                                <label class="avail-day-toggle"><input type="checkbox" name="days" value="sun"><span>Sun</span></label>
                                <label class="avail-day-toggle"><input type="checkbox" name="days" value="mon"><span>Mon</span></label>
                                <label class="avail-day-toggle"><input type="checkbox" name="days" value="tue"><span>Tue</span></label>
                                <label class="avail-day-toggle"><input type="checkbox" name="days" value="wed"><span>Wed</span></label>
                                <label class="avail-day-toggle"><input type="checkbox" name="days" value="thu"><span>Thu</span></label>
                                <label class="avail-day-toggle"><input type="checkbox" name="days" value="fri"><span>Fri</span></label>
                                <label class="avail-day-toggle"><input type="checkbox" name="days" value="sat"><span>Sat</span></label>
                            </div>
                        </div>

                        <div class="form-divider">
                            <div class="form-group">
                                <label for="start-time">Start time</label>
                                <input id="start-time" class="input-format" type="time" required>
                            </div>
                            <div class="form-group">
                                <label for="end-time">End time</label>
                                <input id="end-time" class="input-format" type="time" required>
                            </div>
                        </div>

                        <div class="form-actions">
                            <a href="dashboard.html" class="btn-back">← Back</a>
                            <button type="submit" class="btn-submit">Add availability</button>
                        </div>
                    </form>
                </div>

                <section id="availability-schedule" class="avail-schedule" style="display:none;">
                    <h2 class="avail-schedule__title">You Are Available At</h2>
                    <div id="avail-slots"></div>
                </section>
            </main>

            <footer>
                <p>&copy; 2026 Planora. All Rights Reserved. | Contact: <a href="mailto:support@planora.com">support@planora.com</a></p>
            </footer>
        </div>
    </div>

    <!-- Firebase Module Scripts -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
            }
        }
    </script>
    
    <script type="module" src="JS/firebase-config.js"></script>
    <script type="module" src="JS/utils.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="JS/topbar.js"></script>
    <script type="module" src="JS/auth.js"></script>
    <script type="module" src="JS/availability.js"></script>
    
    <script type="module">
        import { Session } from './JS/utils.js';
        
        // Check if user is logged in
        Session.require();
        
        // Note: availability.js automatically initializes on DOMContentLoaded
        // and handles form submission
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-auth">

    <div class="auth-top">
        <a href="index.html"><img src="images/planora_logo.png" alt="Planora"></a>
    </div>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1>Welcome back</h1>
            <p class="subtitle">Log in to your study workspace</p>

            <form id="login-form">
                <label for="login-email">Email</label>
                <input id="login-email" class="input-format" type="email" placeholder="you@university.edu" required>

                <label for="login-password">Password</label>
                <input id="login-password" class="input-format" type="password" placeholder="••••••••" required>

                <p style="margin: 0 0 8px;"><a href="reset-password.html">Forgot password?</a></p>

                <button type="submit">Log in</button>
            </form>

            <div class="auth-footer">
                New here? <a href="register.html">Create an account</a><br>
                <a href="index.html">Back to home</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Planora. All rights reserved. · <a href="mailto:support@planora.com">support@planora.com</a></p>
    </footer>

    <script src="JS/utils.js"></script>
    <script>
        // API URL
        const API_URL = 'http://localhost:5000/api';

        // Check if already logged in
        if (localStorage.getItem('authToken')) {
            window.location.href = "dashboard.html";
        }

        // Login function
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById("login-email").value.trim().toLowerCase();
            const password = document.getElementById("login-password").value;

            if (!email || !password) {
                showToast("Please enter your email and password.", "error");
                return;
            }

            // Show loading state
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Logging in...";
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Save token and user data
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    showToast(`Welcome back, ${data.user.name}!`, "success");

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                } else {
                    showToast(data.message || "Invalid email or password", "error");
                }
            } catch (error) {
                console.error("Login error:", error);
                showToast("Cannot connect to server. Make sure backend is running on port 5000", "error");
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }

        // Attach event listener
        document.getElementById("login-form").addEventListener("submit", handleLogin);
    </script>

</body>

</html>

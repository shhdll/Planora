<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planora - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-auth">

    <div class="auth-top">
        <a href="index.html"><img src="images/planora_logo.png" alt="Planora"></a>
    </div>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1>Welcome back</h1>
            <p class="subtitle">Log in to your study workspace</p>

            <form id="login-form">
                <label for="login-email">Email</label>
                <input id="login-email" class="input-format" type="email" placeholder="you@university.edu" required>

                <label for="login-password">Password</label>
                <input id="login-password" class="input-format" type="password" placeholder="••••••••" required>

                <p style="margin: 0 0 8px;"><a href="reset-password.html">Forgot password?</a></p>

                <button type="submit">Log in</button>
            </form>

            <div class="auth-footer">
                New here? <a href="register.html">Create an account</a><br>
                <a href="index.html">Back to home</a>
            </div>
        </div>
    </div>

    

    <script src="JS/utils.js"></script>
    <script src="JS/auth.js"></script>
    <script>
        Session.redirectIfLoggedIn();
        document.getElementById("login-form").addEventListener("submit", handleLogin);
    </script>

</body>
</html>
